name: CI / PR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  # 22, não 20: o CLI do Capacitor recusa NodeJS < 22 ("[fatal] The Capacitor
  # CLI requires NodeJS >=22.0.0") e o job Android morria no `cap sync` antes
  # de compilar qualquer coisa. O runner também já avisa que o Node 20 está
  # sendo descontinuado nas actions.
  NODE_VERSION: '22'
  JAVA_VERSION: '17'

jobs:
  # -----------------------------------------------------------------------
  # 1. Instalação e dependências
  # -----------------------------------------------------------------------
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      node_version: ${{ steps.setup.outputs.node_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        id: setup
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

  # -----------------------------------------------------------------------
  # 2. TypeScript
  # -----------------------------------------------------------------------
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

  # -----------------------------------------------------------------------
  # 3. Tests (Vitest)
  # -----------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test

  # -----------------------------------------------------------------------
  # 4. SQL validation (PGlite - sem banco real)
  # -----------------------------------------------------------------------
  test-sql:
    name: SQL validation
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run SQL validation
        run: npm run test:sql

  # -----------------------------------------------------------------------
  # 5. Lint
  # -----------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # -----------------------------------------------------------------------
  # 6. Next.js Build (sem migração em produção)
  # -----------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, test, test-sql]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (skip migration)
        # A `DATABASE_URL` aqui é uma string de mentira, e de propósito.
        #
        # O comentário anterior dizia "DATABASE_URL ausente = pulamos a
        # migração", mas isso deixou de ser verdade: `lib/db.ts` lança no
        # carregamento do módulo quando a variável não existe, e o
        # `next build` importa TODA rota de API para coletar os dados de
        # página. Resultado: "Failed to collect configuration for
        # /api/admin/chamados/[id]" e o job vermelho — sem nenhuma relação
        # com o código do commit.
        #
        # Um host inexistente é justamente o que se quer: a conexão nunca é
        # aberta durante o build (as rotas são dinâmicas), então basta que a
        # string exista e seja sintaticamente válida. Nenhum segredo entra
        # no CI por causa disto.
        env:
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci?sslmode=disable'
        run: npx next build

  # -----------------------------------------------------------------------
  # 7. Capacitor Sync + Android Debug Build (sem keystore)
  # -----------------------------------------------------------------------
  android:
    name: Android Debug
    runs-on: ubuntu-latest
    needs: [typecheck, test, test-sql]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # -------------------------------------------------------------------
      # Setup Java & Android SDK
      # -------------------------------------------------------------------
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      # -------------------------------------------------------------------
      # Capacitor Sync
      # -------------------------------------------------------------------
      - name: Capacitor Sync
        run: npx cap sync

      # -------------------------------------------------------------------
      # Build Debug APK (without signing)
      # -------------------------------------------------------------------
      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug \
            -x lint \
            -x lintVitalRelease \
            --no-daemon \
            -Dorg.gradle.java.home=$JAVA_HOME

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # -----------------------------------------------------------------------
  # 8. Summary
  # -----------------------------------------------------------------------
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [typecheck, test, test-sql, lint, build, android]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript | ${{ needs.typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SQL Validation | ${{ needs['test-sql'].result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android Debug | ${{ needs.android.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ CI completed!" >> $GITHUB_STEP_SUMMARY
