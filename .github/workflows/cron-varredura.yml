name: Varredura periódica (SOS + downwind)

# POR QUE ESTE WORKFLOW EXISTE
#
# O plano Hobby da Vercel só permite Cron Jobs com frequência DIÁRIA
# (schedule com granularidade de minuto/hora, tipo "*/2 * * * *", é
# rejeitado no deploy — ver docs/OPERACAO-SOS.md e
# docs/RASTREIO-BACKGROUND-ANDROID-LIMITACOES.md). Isso é insuficiente para:
#   - escalada de SOS (emergência medida em minutos);
#   - alerta de silêncio de downwind (limiar padrão de 5 minutos).
#
# Este workflow substitui um cron de minuto que o Vercel Hobby não aceita.
# vercel.json mantém os crons nativos só em frequência diária (manutenção/
# fallback); a varredura frequente de verdade roda aqui.
#
# ⚠️ MEDIDO EM PRODUÇÃO, 31/08-01/09/2026: o atraso NÃO é de "vários
# minutos". É de HORAS.
#
# Em 21,5 h de observação, com `*/5` configurado (259 execuções esperadas),
# o GitHub rodou este workflow SEIS vezes:
#
#     31/08 19:15 -> 31/08 23:14 = 4,0 h
#     31/08 23:14 -> 01/09 01:50 = 2,6 h
#     01/09 01:50 -> 01/09 06:55 = 5,1 h
#     01/09 06:55 -> 01/09 12:23 = 5,5 h
#     01/09 12:23 -> 01/09 16:48 = 4,4 h
#
# Intervalo médio: 4,3 h — uma execução a cada ~52 agendadas. O GitHub trata
# `schedule` em repositório gratuito como trabalho de baixa prioridade e o
# posterga sob carga; a documentação avisa que não há garantia de horário.
#
# O QUE ISSO SIGNIFICA NA ÁGUA: a escalada de SOS amplia o raio aos 2 min
# (5 -> 15 -> 50 km). Com varredura a cada 4,3 h, um pedido de socorro
# disparado às 17h só teria a primeira ampliação por volta das 21h. Para
# emergência isso é, na prática, o mesmo que não ter escalada.
#
# Este workflow FUNCIONA — os dois `curl` respondem 2xx, o CRON_SECRET está
# correto — mas a frequência o torna insuficiente para o que ele existe.
# Ele fica como rede de segurança de última instância.
#
# A SOLUÇÃO REAL é um scheduler que honre o minuto: cron-job.org (grátis) ou
# Upstash QStash apontando para as duas rotas com o CRON_SECRET no header,
# ou o plano Pro da Vercel (cron "* * * * *"). Ver docs/OPERACAO-SOS.md.

on:
  schedule:
    # A cada 5 minutos — mínimo suportado pelo GitHub Actions.
    - cron: '*/5 * * * *'
  workflow_dispatch: {} # permite disparo manual para depuração

concurrency:
  # Evita que duas execuções se sobreponham se uma atrasar (ver limitação
  # acima) — a próxima execução agendada espera a anterior terminar em vez
  # de rodar em paralelo e duplicar chamadas.
  group: cron-varredura
  cancel-in-progress: false

jobs:
  varredura:
    name: Varredura SOS + downwind
    runs-on: ubuntu-latest
    steps:
      - name: Varredura de escalada de SOS
        run: |
          curl --fail --silent --show-error \
            --max-time 30 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.APP_BASE_URL || 'https://kiteninja.vercel.app' }}/api/cron/sos-escalada"

      - name: Varredura de silêncio de downwind
        run: |
          curl --fail --silent --show-error \
            --max-time 30 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.APP_BASE_URL || 'https://kiteninja.vercel.app' }}/api/cron/downwind-silencio"
